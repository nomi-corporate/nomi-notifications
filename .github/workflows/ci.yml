name: Repository checks
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  repository-checks:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check commit whitespace
        run: git show --format= --check HEAD
      - name: Check repository documentation
        shell: bash
        run: |
          test -s README.md
          test -s CONTRIBUTING.md
          test -s docs/architecture.md
          test -s docs/delivery.md
